name: help-desk-web

services:
  web:
    # The default compose.override.yaml turns this into the development container.
    # compose.prod.yaml replaces this image with the static Nginx runtime.
    image: node:${NODE_VERSION:-22.23.5}-alpine
    init: true
    restart: unless-stopped
    working_dir: /usr/src/app
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "5173"
      - --strictPort
    environment:
      NODE_ENV: development
      HUSKY: "0"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_APP_NAME: ${VITE_APP_NAME:-Help Desk}
      # The Symfony API is a separate Compose project exposed on the host.
      # Override API_PROXY_TARGET in .env if your API uses another host/port.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-https://localhost:80}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
