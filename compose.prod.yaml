services:
  web:
    image: nginx:1.28-alpine
    working_dir: /
    command:
      - /bin/sh
      - -ec
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        server {
            listen 80 default_server;
            listen [::]:80 default_server;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
            charset utf-8;

            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;

            location = /healthz {
                access_log off;
                return 204;
            }

            location = /api {
                return 308 /api/;
            }

            location ^~ /api/ {
                proxy_pass ${API_UPSTREAM:-http://host.docker.internal:80};
                proxy_http_version 1.1;
                proxy_set_header Host ${API_HOST_HEADER:-localhost};
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $$host;
                proxy_set_header X-Forwarded-Proto $$scheme;
                proxy_ssl_server_name on;
                proxy_connect_timeout 5s;
                proxy_read_timeout 60s;
            }

            location = /index.html {
                add_header Cache-Control "no-cache";
            }

            # Vite emits content-hashed filenames for production assets.
            location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|webp|woff|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                try_files $$uri =404;
            }

            # Client-side routing: unknown paths are resolved by React Router.
            location / {
                try_files $$uri $$uri/ /index.html;
            }
        }
        NGINX
        exec nginx -g 'daemon off;'
    environment:
      NODE_ENV: production
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:80}
      # Set this to the virtual host expected by Symfony/Caddy when needed.
      API_HOST_HEADER: ${API_HOST_HEADER:-localhost}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - web_dist:/usr/share/nginx/html:ro
    depends_on:
      web-assets:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/healthz || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Build the SPA with the Dockerfile's build stage, then copy only the static
  # artefacts into a shared volume. Node.js and npm are not present in the runtime.
  web-assets:
    image: help-desk-web-assets:${WEB_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: build
      args:
        NODE_VERSION: ${NODE_VERSION:-22.23.5}
    command:
      - /bin/sh
      - -ec
      - |
        test -d /usr/src/app/dist
        rm -rf /dist/*
        cp -a /usr/src/app/dist/. /dist/
    volumes:
      - web_dist:/dist
    restart: "no"

volumes:
  web_dist:
